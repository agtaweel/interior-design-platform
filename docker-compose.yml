services:
  app:
    build:
      context: ./backend
    container_name: idp-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./backend:/var/www
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    depends_on:
      - postgres
      - redis
    command: sh -c "composer install --no-interaction && php artisan migrate --force && php artisan serve --host=0.0.0.0 --port=8000"

  postgres:
    image: postgres:16-alpine
    container_name: idp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: interior_design_platform
    ports:
      - "5440:5432"
    volumes:
      - idp-postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: idp-redis
    restart: unless-stopped
    ports:
      - "6390:6379"
    volumes:
      - idp-redis-data:/data

volumes:
  idp-postgres-data:
  idp-redis-data:
