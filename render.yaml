# Render Blueprint for a free-tier demo deploy of the interior-design-platform monorepo.
#
# NOT actually applied via Render's Blueprint feature (New -> Blueprint) — that flow turned out
# to require a card on file too, same as Render's managed Postgres does (see below). Kept here as
# the single source of truth for what env vars each service needs; DEPLOY.md walks through
# creating both services individually instead (New -> Web Service, which does not ask for a
# card), transcribing the same values from this file by hand.
#
# Why no `databases:` block: Render now requires a card on file to provision ANY Postgres
# instance, including their free plan — confirmed while setting this up, even though the two web
# services below don't ask for one. Rather than fight that, the database lives on Neon
# (https://neon.tech), which has a genuinely card-free free Postgres tier. Before applying this
# Blueprint:
#   1. Sign up at neon.tech (no card), create a project — any region.
#   2. From its dashboard, grab the connection details (host, database name, username, password
#      — Neon shows these individually, or as one connection string you can pick apart).
#   3. When Render applies this Blueprint, it will prompt you to fill in the five `sync: false`
#      DB_* values below (that's what `sync: false` means: "ask me, don't guess") — paste in
#      what you got from Neon.
#
# Service URLs are hardcoded as https://idp-backend.onrender.com and
# https://idp-frontend.onrender.com because Render assigns a service's public URL from its
# `name` field before the other service exists yet, so there's no `fromService` value to
# reference at first apply. If you rename either service below, update every URL that mentions
# it (APP_URL, FRONTEND_URL, NEXT_PUBLIC_API_BASE_URL) to match, or the two services won't be
# able to talk to each other / build links correctly.
#
# Known free-tier tradeoffs, worth knowing going in:
#  - Free web services spin down after ~15 min idle and take ~30-60s to wake back up on the
#    next request — fine for a demo link, not for anything latency-sensitive.
#  - Free web services have no persistent disk: any file uploaded through Media/Documents (or
#    change-order/proposal attachments) is lost on the next restart or redeploy. Fine for a demo
#    walkthrough, not for data you need to keep.
#  - Neon's free project can idle/"hibernate" after inactivity too, same story as the web
#    services — the first query after a while wakes it back up with a short delay.
#  - MAIL_MAILER is left as `log` (same as local dev) — password-reset/OTP/notification emails
#    write to the backend service's log output instead of actually sending. Fine to view via
#    Render's log tab for a demo; swap in a real MAIL_* config if you need emails to actually
#    arrive.

services:
  - type: web
    name: idp-backend
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile.render
    dockerContext: ./backend
    envVars:
      - key: APP_NAME
        value: Interior Design Platform
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      # Generated fresh for this deploy (`php artisan key:generate --show`) — committing it is
      # an acceptable shortcut for a one-click demo blueprint, not a production practice. Rotate
      # it (or switch this to `sync: false` and set it in the Render dashboard instead) if this
      # deployment ever needs to be taken seriously.
      - key: APP_KEY
        value: base64:b/oSS29NFvK42rYNGuiOEoS+ocMgm++NWmqNDIbKT+c=
      - key: APP_URL
        value: https://idp-backend.onrender.com
      - key: FRONTEND_URL
        value: https://idp-frontend.onrender.com
      - key: LOG_CHANNEL
        value: stderr
      - key: DB_CONNECTION
        value: pgsql
      # Neon requires SSL — see the top-of-file note for why this isn't a Render-managed
      # database. `prefer` (Laravel's own default) would probably also work, but `require` is
      # explicit about the actual requirement instead of leaving it to a negotiated fallback.
      - key: DB_SSLMODE
        value: require
      # The five DB_* values below are `sync: false` — Render will prompt for these when you
      # apply the Blueprint rather than filling them from a `fromDatabase` reference, since there
      # is no Render-managed database in this setup. Paste in the host/database/username/password
      # from your Neon project (DB_PORT is 5432 for every Neon project).
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "5432"
      - key: DB_DATABASE
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      # Redis isn't provisioned at all for this deploy — session/cache/queue already default to
      # `database` in this app's own .env (see backend/.env), so nothing here actually needs
      # Redis to function; it's only in docker-compose.yml for local parity with a future queue
      # worker that doesn't exist yet.
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: MAIL_MAILER
        value: log

  - type: web
    name: idp-frontend
    runtime: docker
    plan: free
    dockerfilePath: ./frontend/Dockerfile.render
    dockerContext: ./frontend
    envVars:
      # Inlined into the client JS bundle at `npm run build` time (see Dockerfile.render) — this
      # must already be correct when Render builds the image, not just at container start.
      - key: NEXT_PUBLIC_API_BASE_URL
        value: https://idp-backend.onrender.com/api/v1
